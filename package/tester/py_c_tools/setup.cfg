[isort]
skip_gitignore = true
sections = FUTURE,STDLIB,THIRDPARTY,QT,FIRSTPARTY,LOCALFOLDER
known_qt = PyQt5
known_third_party = sip, serial
known_first_party = c_tools
multi_line_output = 3
line_length = 88
include_trailing_comma = 1
use_parentheses = true

[flake8]
max-line-length=88
extend-ignore = E203, W503
