connections:
  pb:
    type: socket | packer(hisense) | coder(crc) | topic
    parameters:
      - baudrate: 115200
      - {}
      - method: lte16
      - topic_length: 2
    setup:
      - ["\\x03\\x00", "\\x01"]
    teardown:
      - ["\\x03\\x00", "\\x00"]
entities:
  display:
    - connection: pb
      type: "led"
      format: "888"
      grab:
        command: "\\x05\\x00"
        index: 0
    - connection: pb
      type: "led"
      format: "18:88"
      grab:
        command: "\\x05\\x00"
        index: 1
  button:
